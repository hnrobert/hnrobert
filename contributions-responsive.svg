<svg width="100%" viewBox="-1 -1 462 182" style="min-width:280px" xmlns="http://www.w3.org/2000/svg">
  <style>
    
    svg{--s-bg:rgba(255,255,255,0.8);--s-bd:rgba(0,0,0,0.1);--s-tp:#1f2937;
      --s-ts:#6b7280;--s-ac:#3b82f6;--s-pb:#fae8ff;}
    @media(prefers-color-scheme:dark){svg{
      --s-bg:rgba(15,23,42,0.8);--s-bd:rgba(255,255,255,0.1);--s-tp:#f8fafc;
      --s-ts:#cbd5e1;--s-ac:#60a5fa;--s-pb:#334155;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .card{animation:fadeUp .5s cubic-bezier(.33,1,.68,1) both}
    .title{animation:fadeUp .45s .08s cubic-bezier(.33,1,.68,1) both}
    .i0{animation:fadeUp .45s .14s cubic-bezier(.33,1,.68,1) both}
    .i1{animation:fadeUp .45s .24s cubic-bezier(.33,1,.68,1) both}
    .i2{animation:fadeUp .45s .34s cubic-bezier(.33,1,.68,1) both}
    .i3{animation:fadeUp .45s .44s cubic-bezier(.33,1,.68,1) both}
    .i4{animation:fadeUp .45s .54s cubic-bezier(.33,1,.68,1) both}
    .bar{animation:fadeIn .3s .25s ease both}
  </style>
  <rect class="card" width="100%" height="180" rx="16" fill="var(--s-bg)" stroke="var(--s-bd)" stroke-width="1"/>
  <svg x="50%" y="0" width="460" height="100%" overflow="visible"><g transform="translate(-230, 0)"><line x1="184" y1="30" x2="184" y2="150"
    stroke="var(--s-bd)" stroke-width="1"/>
    <g class="i0">
    <text x="92" y="90.4" fill="var(--s-tp)" font-size="28" font-weight="700"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">5,639</text>
    <text x="92" y="109.76" fill="var(--s-ts)" font-size="13" font-weight="500"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Total Commits</text>
    </g>
    <g class="title">
    <text x="322" y="54.08" fill="var(--s-tp)" font-size="13" font-weight="600"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Contributions Last Year</text>
    </g>
    
    <g class="i1">
    <text x="253" y="81.75999999999999" fill="var(--s-tp)" font-size="19" font-weight="600"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">3,932</text>
    <text x="253" y="95.67999999999999" fill="var(--s-ts)" font-size="11"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Commits</text>
    </g>
    <g class="i2">
    <text x="391" y="81.75999999999999" fill="var(--s-tp)" font-size="19" font-weight="600"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">308</text>
    <text x="391" y="95.67999999999999" fill="var(--s-ts)" font-size="11"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">PRs</text>
    </g>
    <g class="i3">
    <text x="253" y="121.36000000000001" fill="var(--s-tp)" font-size="19" font-weight="600"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">175</text>
    <text x="253" y="135.28" fill="var(--s-ts)" font-size="11"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Issues</text>
    </g>
    <g class="i4">
    <text x="391" y="121.36000000000001" fill="var(--s-tp)" font-size="19" font-weight="600"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">35</text>
    <text x="391" y="135.28" fill="var(--s-ts)" font-size="11"
      text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Reviews</text>
    </g></g></svg>
</svg>