<svg width="462" height="182" viewBox="-1 -1 462 182" xmlns="http://www.w3.org/2000/svg">
  <style>
    
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .card{animation:fadeUp .5s cubic-bezier(.33,1,.68,1) both}
    .title{animation:fadeUp .45s .08s cubic-bezier(.33,1,.68,1) both}
    .i0{animation:fadeUp .45s .14s cubic-bezier(.33,1,.68,1) both}
    .i1{animation:fadeUp .45s .24s cubic-bezier(.33,1,.68,1) both}
    .i2{animation:fadeUp .45s .34s cubic-bezier(.33,1,.68,1) both}
    .i3{animation:fadeUp .45s .44s cubic-bezier(.33,1,.68,1) both}
    .i4{animation:fadeUp .45s .54s cubic-bezier(.33,1,.68,1) both}
    .bar{animation:fadeIn .3s .25s ease both}
  </style>
  <rect class="card" width="460" height="180" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
